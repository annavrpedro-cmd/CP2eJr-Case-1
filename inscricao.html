<!DOCTYPE html>
<html lang="pt-br"> <!-- Idioma  português -->

<head>

    <meta charset="UTF-8"> <!-- Fomatação linguagem  -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Tornar compativel com o edge  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta para tela de celular -->

    <title>Inscrição | Semana de Empreendedorismo</title> <!-- Título -->

    <link rel="stylesheet" href="style.css"> <!-- Conecta com o arquivo CSS -->

</head>

<body>

    <header> <!-- Topo da página -->

        <h1>Semana de Empreendedorismo</h1> <!-- Título principal -->
        <p>Garanta sua vaga agora mesmo!</p> <!-- Subtítulo -->

    </header>

    <main> <!-- Conteúdo principal -->

        <section class="secao-formulario"> <!-- Caixa que guarda o formulário -->

            <h2>Formulário de Inscrição</h2> <!-- Título da seção -->

            <form action="#"> <!-- Início do formulário ( sem dados reais ) -->
                
                <label for="nome">Nome completo</label> <!-- Rótulo indicando o que digitar -->
                <input type="text" id="nome" name="nome" required> <!-- Campo de texto obrigatório -->

                <label for="email">E-mail</label> 
                <input type="email" id="email" name="email" required> 

                <label for="instituicao">Instituição / Curso</label> 
                <input type="text" id="instituicao" name="instituicao" required> 

                <label for="workshop">Workshop de interesse</label> 
                <select id="workshop" name="workshop" required> <!-- Lista suspensa de opções -->

                    <option value="">Selecione um workshop</option> <!-- Opção padrão invisível -->
                    <option value="1">Workshop 1: Validação de Ideias</option> 
                    <option value="2">Workshop 2: Business Model Canvas</option> 
                    <option value="3">Workshop 3: Marketing Digital</option> 
                    <option value="4">Workshop 4: Captação de Investimento</option>
                    <option value="5">Workshop 5: Gestão Financeira</option> 
                    <option value="6">Workshop 6: Design Thinking</option> 

                </select>

                <label for="telefone">Telefone (opcional)</label> 
                <input type="tel" id="telefone" name="telefone"> <!-- Campo de telefone ( opcional ) -->

                <button type="submit" class="btn-confirmar">Confirmar Inscrição</button> <!-- Botão para enviar -->
            
            </form>

        </section>

        <div class="container-voltar">  <!-- Botão para voltar à página inicial -->
            <a href="index.html" class="btn-voltar">← Voltar para a página inicial</a>
        </div>

    </main>

</body>

</html>
